name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - CLAUDE.md
      - AGENTS.md
      - GEMINI.md
      - deploy.sh
      - distrobuilder.yaml
      - incus-web-profile.yaml
      - scripts/**
      - tests/**
      - docs/contracts/**
      - docs/superpowers/**
      - apps/web/**
  pull_request:
    paths:
      - .github/workflows/**
      - CLAUDE.md
      - AGENTS.md
      - GEMINI.md
      - deploy.sh
      - distrobuilder.yaml
      - incus-web-profile.yaml
      - scripts/**
      - tests/**
      - docs/contracts/**
      - docs/superpowers/**
      - apps/web/**

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    uses: dinglebear-ai/workflows/.github/workflows/fleet-contract.yml@eb5f36cf517ffc949aca1c81e2ccbc71b5a85267
    with:
      profile: node
      implementation-ref: eb5f36cf517ffc949aca1c81e2ccbc71b5a85267

  web:
    uses: dinglebear-ai/workflows/.github/workflows/fast-node.yml@eb5f36cf517ffc949aca1c81e2ccbc71b5a85267
    with:
      node-version: "22"
      working-directory: apps/web
      cache-dependency-path: apps/web/package-lock.json
      install-command: npm ci --no-audit --no-fund
      audit-command: npm audit --audit-level=high
      lint-command: npm run lint
      typecheck-command: ""
      test-command: npm run test:coverage
      build-command: npm run build
      timeout-minutes: 20

  policy:
    uses: dinglebear-ai/workflows/.github/workflows/fast-ops.yml@eb5f36cf517ffc949aca1c81e2ccbc71b5a85267
    with:
      shell-globs: "deploy.sh scripts/**/*.sh tests/**/*.sh"
      policy-command: >-
        bash tests/deploy_static_tests.sh &&
        find scripts -type f -name '*.mjs' -print0 | xargs -0 node --check &&
        node --test tests/export_onboarding_test.mjs &&
        node tests/build_worker_smoke.mjs &&
        node tests/check_markdown_links.mjs
      timeout-minutes: 15

  gate:
    name: CI
    if: always()
    needs: [contract, web, policy]
    runs-on: [self-hosted, ci-pool-ops]
    timeout-minutes: 2
    steps:
      - name: Require every fast lane
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: test "$RESULTS" = "success success success"
